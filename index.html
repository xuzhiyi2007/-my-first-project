<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简工具 - 你的效率管家</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117; 
            color: #c9d1d9; 
            line-height: 1.6;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 20px;
        }
        .badge {
            display: inline-block;
            background-color: rgba(46, 160, 67, 0.15);
            color: #3fb950;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
            border: 1px solid rgba(63, 185, 80, 0.3);
        }
        h1 {
            font-size: 3rem;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: -1px;
            line-height: 1.2;
        }
        p.subtitle {
            font-size: 1.2rem;
            color: #8b949e;
            margin-bottom: 40px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 60px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
            cursor: pointer;
        }
        .btn-primary {
            background-color: #238636;
            color: #ffffff;
            border: 1px solid rgba(240, 246, 252, 0.1);
        }
        .btn-primary:hover {
            background-color: #2ea043;
        }
        .btn-secondary {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .btn-secondary:hover {
            background-color: #30363d;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
            text-align: left;
        }
        .feature-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 20px;
            border-radius: 8px;
        }
        .feature-card h3 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .feature-card p {
            font-size: 0.9rem;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">🚀 新一代托管服务上线</div>
        <h1>让效率翻倍<br>的极简工具</h1>
        <p class="subtitle">省去复杂的配置，无需搭建服务器。<br>一键开启你的云端工作流。</p>
        
        <div class="btn-group">
            <a href="#" class="btn btn-primary">免费开始使用</a>
            <a href="https://github.com/xuzhiyi2007" class="btn btn-secondary">查看 GitHub</a>
        </div>

        <div class="features">
            <div class="feature-card">
                <h3>⚡ 极速部署</h3>
                <p>基于全球 CDN 加速，无论用户在哪里，都能秒开网页。</p>
            </div>
            <div class="feature-card">
                <h3>🔒 安全可靠</h3>
                <p>内置 HTTPS 加密，保护每一次数据传输。</p>
            </div>
            <div class="feature-card">
                <h3>📦 开源核心</h3>
                <p>核心代码完全开源，支持自己部署，或使用我们的托管服务。</p>
            </div>
        </div>
    </div>
</body>
</html>
